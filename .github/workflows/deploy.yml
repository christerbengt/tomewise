name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-test-api:
    name: Build and test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Tomewise.Api/Tomewise.Api.csproj

      - name: Build
        run: dotnet build src/Tomewise.Api/Tomewise.Api.csproj --no-restore -c Release

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: src/tomewise-client

      - name: Build
        run: npm run build
        working-directory: src/tomewise-client

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-and-test-api
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render API deploy
        run: |
          curl -X POST ${{ secrets.RENDER_API_DEPLOY_HOOK }}

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render frontend deploy
        run: |
          curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}